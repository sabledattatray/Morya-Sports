<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- M block (red/primary) - tilted left -->
  <g transform="translate(6, 22) rotate(-8, 13, 13)">
    <rect width="26" height="26" rx="7" fill="#FF1E1E" />
    
    <!-- Small Gold Trophy on top of M block -->
    <path d="M13,-4 L9,-4 L9,-2 C9,-1 9.5,-0.5 10,0 L16,0 C16.5,-0.5 17,-1 17,-2 L17,-4 L13,-4 Z" fill="#FFD700" />
    <path d="M10,-2 C8.5,-2 8.5,-4 8.5,-4 L10,-4 M16,-2 C17.5,-2 17.5,-4 17.5,-4 L16,-4" stroke="#FFD700" stroke-width="0.8" fill="none" />
    <rect x="11.5" y="-1" width="3" height="1.2" fill="#FFB800" />
    <rect x="9.5" y="0.2" width="7" height="1" rx="0.3" fill="#B45309" />
    
    <!-- M Text -->
    <text x="13" y="19.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF">M</text>
  </g>
  
  <!-- S block (orange/secondary) - tilted right -->
  <g transform="translate(29, 20) rotate(6, 13, 13)">
    <rect width="26" height="26" rx="7" fill="#FF9900" />
    <!-- S Text -->
    <text x="13" y="19.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#0B0F19">S</text>
  </g>
  
  <!-- Sleek neon star/sparkle at top right -->
  <path d="M54,10 L55.5,13.5 L59,15 L55.5,16.5 L54,20 L52.5,16.5 L49,15 L52.5,13.5 Z" fill="#FF9900" />
</svg>
