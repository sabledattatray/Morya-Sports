<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- Apple touch icon - Midnight background -->
  <rect width="180" height="180" rx="42" fill="#0B0F19" />
  <rect x="2" y="2" width="176" height="176" rx="40" stroke="#FF1E1E" stroke-width="2" opacity="0.3" />
  
  <!-- M block (red/primary) - tilted left -->
  <g transform="translate(38, 42) rotate(-8, 24, 24)">
    <rect width="48" height="48" rx="12" fill="#FF1E1E" />
    
    <!-- Gold Trophy -->
    <path d="M24,-7 L17,-7 L17,-3.5 C17,-1.8 17.8,-0.9 19,0 L29,0 C30.2,-0.9 31,-1.8 31,-3.5 L31,-7 L24,-7 Z" fill="#FFD700" />
    <path d="M19,-3.5 C16,-3.5 16,-7 16,-7 L19,-7 M29,-3.5 C32,-3.5 32,-7 32,-7 L29,-7" stroke="#FFD700" stroke-width="1.2" fill="none" />
    <rect x="21.5" y="-1.5" width="5" height="2" fill="#FFB800" />
    <rect x="18" y="0.5" width="12" height="1.8" rx="0.5" fill="#B45309" />
    
    <!-- M Text -->
    <text x="24" y="36.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="31" fill="#FFFFFF">M</text>
  </g>
  
  <!-- S block (orange/secondary) - tilted right -->
  <g transform="translate(82, 38) rotate(6, 24, 24)">
    <rect width="48" height="48" rx="12" fill="#FF9900" />
    <!-- S Text -->
    <text x="24" y="36.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="31" fill="#0B0F19">S</text>
  </g>
  
  <!-- Brand Text -->
  <text x="90" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" letter-spacing="2">MORYA SPORTS</text>
  <text x="90" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" fill="#FF9900" letter-spacing="1">BADLAPUR</text>
  
  <!-- Sparkle star -->
  <path d="M148,26 L150,31 L155,33 L150,35 L148,40 L146,35 L141,33 L146,31 Z" fill="#FF9900" />
</svg>
